<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>PDF Reader</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
</head>

<body>

  <!-- TOP BAR -->
  <header class="topbar">
    <h1>
      <i class="fa-solid fa-file-pdf"></i>
      Reader
    </h1>

    <div id="pageIndicator" class="page-indicator">
      Page <span id="currentPage">–</span> / <span id="totalPages">–</span>
    </div>

    <input type="file" id="pdfInput" accept="application/pdf" />
  </header>

  <!-- MAIN LAYOUT -->
  <main class="app">

    <!-- PAGE THUMBNAILS -->
    <aside class="page-list" id="pages"></aside>

    <!-- READER AREA -->
    <section class="reader">

      <!-- CONTROLS -->
      <div class="controls">

        <button id="playPauseBtn">
          <i class="fa-solid fa-play"></i>
          <span>Play</span>
        </button>


        <button id="stopBtn" aria-label="Stop speech">
          <i class="fa-solid fa-stop"></i>
          <span>Stop</span>
        </button>

        <div class="divider"></div>

        <button id="copyBtn">
          <i class="fa-solid fa-copy"></i>
          <span>Copy</span>
        </button>

        <button id="uploadBtn">
          <i class="fa-solid fa-upload"></i>
          <span></span>
        </button>

        <label class="control-group">
          <i class="fa-solid fa-language"></i>
          <span>Language</span>
          <select id="languageSelect">
            <option value="hin" data-tts="hi-IN">Hindi</option>
            <option value="eng" data-tts="en-US">English</option>
          </select>
        </label>

        <label class="control-group">
          <i class="fa-solid fa-microphone"></i>
          <span>Voice</span>
          <select id="voiceSelect"></select>
        </label>

        <label class="control-group">
          <i class="fa-solid fa-gauge-high"></i>
          <span>Speed</span>
          <input type="range" id="rateControl" min="0.5" max="2.0" step="0.1" value="1.0" />
          <span id="rateValue">1.0x</span>
        </label>



      </div>

      <!-- TEXT DISPLAY -->
      <div id="textPanel" class="text-panel"></div>

    </section>
  </main>

  <!-- IMAGE FULLSCREEN PREVIEW -->
  <div id="previewOverlay" class="preview-overlay hidden">
    <img id="previewImage" />
  </div>


  <!-- GLOBAL LOADER -->
  <div id="loader" class="loader hidden">
    <div class="loader-box">
      <div class="spinner"></div>
      <div id="loaderText">Loading…</div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>

</html>
