<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>PDF Reader</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1f2937">

</head>

<body>

  <!-- TOP BAR -->
  <header class="topbar">
    <h1>
      <i class="fa-solid fa-file-pdf"></i>
      Reader
    </h1>


    <div id="infoPanel" class="info-panel hidden">
      <div class="info-row"><strong>Name:</strong> <span id="infoName">–</span></div>
      <div class="info-row"><strong>Total pages:</strong> <span id="infoPages">–</span></div>
      <div class="info-row"><strong>File size:</strong> <span id="infoSize">–</span></div>
    </div>


    <div id="pageIndicator" class="page-indicator">
      Page <span id="currentPage">–</span> / <span id="totalPages">–</span>
    </div>
    <button id="infoBtn" class="info-btn" aria-label="PDF info">
      <i class="fa-solid fa-circle-info"></i>
    </button>
    <input type="file" id="pdfInput" accept="application/pdf" />
  </header>

  <!-- MAIN LAYOUT -->
  <main class="app">

    <!-- PAGE THUMBNAILS -->
    <aside class="page-list" id="pages"></aside>

    <!-- READER AREA -->
    <section class="reader">

      <!-- CONTROLS -->
      <div class="controls">

        <button id="playPauseBtn">
          <i class="fa-solid fa-play"></i>
          <span>Play</span>
        </button>


        <button id="stopBtn" aria-label="Stop speech">
          <i class="fa-solid fa-stop"></i>
          <span>Stop</span>
        </button>

        <div class="divider"></div>

        <button id="copyBtn">
          <i class="fa-solid fa-copy"></i>
          <span>Copy</span>
        </button>

        <button id="uploadBtn">
          <i class="fa-solid fa-upload"></i>
          <span></span>
        </button>

        <label class="control-group">
          <i class="fa-solid fa-language"></i>
          <span>Language</span>
          <select id="languageSelect">
            <option value="hin" data-tts="hi-IN">Hindi</option>
            <option value="eng" data-tts="en-US">English</option>
          </select>
        </label>

        <label class="control-group">
          <i class="fa-solid fa-microphone"></i>
          <span>Voice</span>
          <select id="voiceSelect"></select>
        </label>

        <label class="control-group">
          <i class="fa-solid fa-gauge-high"></i>
          <span>Speed</span>
          <input type="range" id="rateControl" min="0.5" max="2.0" step="0.1" value="1.0" />
          <span id="rateValue">1.0x</span>
        </label>

        <label class="control-group">
          <span>From</span>
          <input type="number" id="pageFrom" min="1" style="width:70px">
        </label>

        <label class="control-group">
          <span>To</span>
          <input type="number" id="pageTo" min="1" style="width:70px">
        </label>

        <button id="loadRangeBtn">
          <i class="fa-solid fa-layer-group"></i>
          <span>Load</span>
        </button>


      </div>

      <!-- TEXT DISPLAY -->
      <div id="textPanel" class="text-panel"></div>

    </section>
  </main>

  <!-- IMAGE FULLSCREEN PREVIEW -->
  <div id="previewOverlay" class="preview-overlay hidden">
    <button id="previewPrev" class="preview-nav left">
      <i class="fa-solid fa-chevron-left"></i>
    </button>

    <img id="previewImage" />

    <button id="previewNext" class="preview-nav right">
      <i class="fa-solid fa-chevron-right"></i>
    </button>
  </div>




  <!-- GLOBAL LOADER -->
  <div id="loader" class="loader hidden">
    <div class="loader-box">
      <div class="spinner"></div>
      <div id="loaderText">Loading…</div>
    </div>
  </div>
  <script type="module" src="./src/app.js"></script>
  <script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js");
    });
  }
</script>

</body>

</html>
